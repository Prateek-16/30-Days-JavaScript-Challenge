<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="apply_box">
            <h1>
                Job Application Form <span class="title-small"> (Web) </span>
            </h1>
            <form action="">
                <div class="form_container">
                    <div class="form_control">
                        <label for="FirstName">First Name</label>
                        <input type="text" name="FirstName" id="FirstName">
                    </div>

                    <div class="form_control">
                        <label for="LastName">Last Name</label>
                        <input type="text" name="LastName" id="LastName">
                    </div>

                    <div class="form_control">
                        <label for="Mail">Email</label>
                        <input type="email" name="Mail" id="Mail">
                    </div>

                    <div class="form_control">
                        <label for="Job-Role">Job Role</label>
                        <select name="Job-Role" id="Job-Role">
                            <option value="">Select Job role</option>
                            <option value="FrontEnd">FrontEnd</option>
                            <option value="BackEnd">BackEnd</option>
                            <option value="FullStack">FullStack</option>
                            <option value="ui_ux">UI UX Designer</option>
                        </select>
                    </div>

                    <div class="form_control">
                        <label for="Address">Address</label>
                        <textarea name="Address" id="Address " row="4" cols="50"></textarea>
                    </div>

                    <div class="form_control">
                        <label for="City">City</label>
                        <input type="text" name="City" id="City">
                    </div>

                    <div class="form_control">
                        <label for="Pin">Pin Code</label>
                        <input type="number" name="Pin" id="Pin">
                    </div>

                    <div class="form_control">
                        <label for="StartDate">Start Date</label>
                        <input type="date" name="StartDate" id="StartDate">
                    </div>

                    <div class="form_control">
                        <label for="Uplaod_CV">Upload CV</label>
                        <input type="file" name="Uplaod_CV" id="Uplaod_CV">
                    </div>

                    <div class="button_control">
                        <button type="submit">Apply Now</button>
                    </div>
                </div>


            </form>
        </div>
    </div>
</body>

</html>
